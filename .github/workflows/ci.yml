# Keeps the live site in sync with this repository.
#
# Every push and pull request is tested. A push to main that passes the tests is built and deployed to the live
# site (Cloudflare Worker assistant-api, https://assistant-api.assistant-service.workers.dev).
#
# Deploying needs one repository secret: CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Until it exists, the deploy job skips itself with a notice, and the site stays as it is.
name: ci
on:
  push:
    paths-ignore: ["**.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-live-site
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice title=Not deployed::Add the CLOUDFLARE_API_TOKEN repository secret to deploy main to the live site."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
      - uses: actions/setup-node@v5
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.ok == 'true'
        run: npm ci
      - if: steps.token.outputs.ok == 'true'
        run: npm run build
      - name: Deploy to the live site
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy --message "From GitHub, commit ${GITHUB_SHA::7}"
